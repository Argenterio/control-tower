<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Waves Gradient -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="waveEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tower Steel Gradient -->
    <linearGradient id="towerSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Dome Glow -->
    <linearGradient id="glassPulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Highway Perspective -->
    <linearGradient id="highwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow & Neon Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgHalo)" />

  <!-- Outer Telemetry Radar Arc -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 8" opacity="0.6" />
  <path d="M 120 330 A 170 170 0 1 1 392 330" fill="none" stroke="url(#waveCyan)" stroke-width="4" stroke-linecap="round" opacity="0.9" />

  <!-- Radar Telemetry Satellite Waves & Nodes -->
  <!-- Left Wing (Cyan) -->
  <g stroke="url(#waveCyan)" stroke-width="2.5" fill="none">
    <path d="M 150 200 A 130 130 0 0 1 230 130" stroke-dasharray="6 4" />
    <circle cx="150" cy="200" r="5" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle cx="185" cy="160" r="4" fill="#38bdf8" />
    <circle cx="230" cy="130" r="5" fill="#38bdf8" filter="url(#glowCyan)" />
  </g>

  <!-- Right Wing (Emerald) -->
  <g stroke="url(#waveEmerald)" stroke-width="2.5" fill="none">
    <path d="M 362 200 A 130 130 0 0 0 282 130" stroke-dasharray="6 4" />
    <circle cx="362" cy="200" r="5" fill="#34d399" />
    <circle cx="327" cy="160" r="4" fill="#34d399" />
    <circle cx="282" cy="130" r="5" fill="#34d399" />
  </g>

  <!-- Highway / Road (Ground perspective) -->
  <polygon points="256,290 130,450 382,450" fill="url(#highwayGrad)" stroke="#334155" stroke-width="2" />
  <!-- Center Highway Dashes -->
  <polygon points="255,305 257,305 258,325 254,325" fill="#38bdf8" opacity="0.9" />
  <polygon points="254,340 258,340 260,370 252,370" fill="#38bdf8" opacity="0.9" />
  <polygon points="251,385 261,385 264,425 248,425" fill="#38bdf8" opacity="0.9" filter="url(#glowCyan)" />

  <!-- Fleet Trucks Silhouette on the Highway -->
  <!-- Left Truck -->
  <g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
    <rect x="148" y="320" width="46" height="38" rx="4" fill="#1e293b" />
    <polygon points="194,332 216,338 216,358 194,358" fill="#0f172a" />
    <circle cx="162" cy="360" r="6" fill="#090d16" stroke="#64748b" />
    <circle cx="204" cy="360" r="6" fill="#090d16" stroke="#64748b" />
    <!-- Headlight Beam -->
    <polygon points="216,346 244,352 244,356 216,352" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Right Fast Delivery Truck -->
  <g fill="#0f172a" stroke="#34d399" stroke-width="2">
    <rect x="318" y="320" width="46" height="38" rx="4" fill="#1e293b" />
    <polygon points="318,332 296,338 296,358 318,358" fill="#0f172a" />
    <circle cx="350" cy="360" r="6" fill="#090d16" stroke="#64748b" />
    <circle cx="308" cy="360" r="6" fill="#090d16" stroke="#64748b" />
    <!-- Headlight Beam -->
    <polygon points="296,346 268,352 268,356 296,352" fill="#34d399" opacity="0.4" />
  </g>

  <!-- Main Airport/Fleet Control Tower -->
  <!-- Spire & Beacons -->
  <line x1="256" y1="50" x2="256" y2="105" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="46" r="6" fill="#38bdf8" filter="url(#glowCyan)" />

  <!-- Observation Glass Cab -->
  <polygon points="230,105 282,105 298,122 214,122" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <!-- Glass Window Panels -->
  <polygon points="208,148 230,122 256,122 248,148" fill="url(#glassPulse)" stroke="#0f172a" stroke-width="2" />
  <polygon points="248,148 256,122 282,122 304,148" fill="url(#glassPulse)" stroke="#0f172a" stroke-width="2" />

  <!-- Deck Platform -->
  <polygon points="196,148 316,148 298,168 214,168" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <line x1="202" y1="152" x2="310" y2="152" stroke="#38bdf8" stroke-width="2" />

  <!-- Central Stem Shaft -->
  <path d="M 224 168 L 230 270 Q 232 305 218 325 L 294 325 Q 280 305 282 270 L 288 168 Z" fill="url(#towerSteel)" stroke="#0f172a" stroke-width="3" />
  <!-- Vertical Modern Ribs -->
  <line x1="256" y1="168" x2="256" y2="325" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <line x1="244" y1="172" x2="240" y2="320" stroke="#64748b" stroke-width="1.5" />
  <line x1="268" y1="172" x2="272" y2="320" stroke="#64748b" stroke-width="1.5" />
</svg>
