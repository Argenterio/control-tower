<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle halo -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tower Gradients -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Truck Gradients -->
    <linearGradient id="truckLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="truckRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Lower Wings Gradients -->
    <linearGradient id="blueWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="greenWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="230" fill="url(#bgGlow)" />

  <!-- Outer Radar Border Arc -->
  <path d="M 100 300 A 180 180 0 1 1 412 300" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Radar / Telemetry Grid Signals (Left: Blue/Cyan, Right: Green) -->
  <!-- Left Side Telemetry (GPS / Connectivity) -->
  <g stroke="#0284c7" stroke-width="3.5" fill="none" opacity="0.85">
    <path d="M 125 215 C 135 180 160 145 200 120" stroke-dasharray="8 6" />
    <path d="M 110 215 L 148 210 L 168 260 L 195 268" />
    <path d="M 148 210 L 175 198 L 205 220" />
    <!-- Nodes -->
    <circle cx="110" cy="215" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="148" cy="210" r="5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="175" cy="198" r="5.5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="205" cy="220" r="5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="195" cy="268" r="5.5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
  </g>

  <!-- Right Side Radar Arcs & Sensors -->
  <g stroke="#059669" stroke-width="3.5" fill="none" opacity="0.85">
    <path d="M 312 120 C 352 145 377 180 387 215" stroke-dasharray="8 6" />
    <path d="M 320 220 C 330 180 355 170 380 200" />
    <path d="M 315 270 L 325 210 L 355 245 L 400 215" />
    <!-- Nodes -->
    <circle cx="342" cy="195" r="5.5" fill="#34d399" stroke="#059669" stroke-width="2" />
    <circle cx="380" cy="200" r="5" fill="#34d399" stroke="#059669" stroke-width="2" />
    <circle cx="400" cy="215" r="6" fill="#34d399" stroke="#059669" stroke-width="2" />
  </g>

  <!-- Central Road / Highway (Perspective) -->
  <g filter="url(#shadow)">
    <polygon points="256,310 115,420 397,420" fill="url(#roadGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Road Lane Markings -->
    <polygon points="255,325 257,325 258,340 254,340" fill="#f8fafc" />
    <polygon points="254,348 258,348 260,368 252,368" fill="#f8fafc" />
    <polygon points="252,378 260,378 263,404 249,404" fill="#f8fafc" />
    <polygon points="248,414 264,414 266,420 246,420" fill="#f8fafc" />
    
    <!-- Road Horizon Light Halo -->
    <ellipse cx="256" cy="328" rx="28" ry="8" fill="#38bdf8" opacity="0.3" filter="url(#cyanGlow)" />
  </g>

  <!-- Central Control Tower Structure -->
  <g filter="url(#shadow)">
    <!-- Tower Antenna Spire -->
    <line x1="256" y1="70" x2="256" y2="105" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="70" x2="256" y2="105" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="256" cy="68" r="4.5" fill="#38bdf8" filter="url(#cyanGlow)" />

    <!-- Tower Roof / Dome -->
    <polygon points="236,105 276,105 288,118 224,118" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
    <polygon points="240,107 272,107 282,116 230,116" fill="#334155" />

    <!-- Observation Deck Glass Canopy -->
    <!-- Faceted Glass Windows -->
    <g stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round">
      <!-- Left Far Window -->
      <polygon points="196,140 224,118 238,118 220,140" fill="url(#glassGrad)" />
      <!-- Left Center Window -->
      <polygon points="220,140 238,118 256,118 245,140" fill="url(#glassGlow)" />
      <!-- Right Center Window -->
      <polygon points="245,140 256,118 274,118 267,140" fill="url(#glassGlow)" />
      <!-- Right Far Window -->
      <polygon points="267,140 274,118 288,118 316,140" fill="url(#glassGrad)" />
    </g>

    <!-- Observation Deck Base Platform -->
    <polygon points="190,140 322,140 305,160 207,160" fill="url(#deckGrad)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
    <line x1="194" y1="144" x2="318" y2="144" stroke="#475569" stroke-width="2" />
    <!-- Secondary Collar -->
    <polygon points="207,160 305,160 292,176 220,176" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Tower Stem / Pillar Shaft -->
    <path d="M 222 176 L 226 270 Q 228 320 216 340 L 296 340 Q 284 320 286 270 L 290 176 Z" fill="url(#towerGrad)" stroke="#0f172a" stroke-width="3.5" />

    <!-- Shaft Architectural Highlights / Vertical Grooves -->
    <path d="M 242 180 L 244 275 Q 245 320 238 340" stroke="#334155" stroke-width="2.5" fill="none" />
    <path d="M 270 180 L 268 275 Q 267 320 274 340" stroke="#475569" stroke-width="2.5" fill="none" />
    <path d="M 256 180 L 256 340" stroke="#64748b" stroke-width="2.5" fill="none" opacity="0.6" />
  </g>

  <!-- Left Heavy Cargo Truck -->
  <g filter="url(#shadow)">
    <!-- Trailer Box -->
    <polygon points="105,274 172,266 172,328 105,336" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
    <polygon points="108,277 169,270 169,325 108,333" fill="#334155" />
    <!-- Roof highlight on trailer -->
    <polygon points="105,274 172,266 168,262 108,269" fill="#64748b" />
    
    <!-- Cabin Structure -->
    <polygon points="172,284 218,292 218,348 172,342" fill="url(#truckLeftGrad)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Cabin Windshield -->
    <polygon points="176,288 214,295 212,312 176,307" fill="#7dd3fc" stroke="#0f172a" stroke-width="2" />
    <!-- Cabin Bumper / Grille -->
    <polygon points="174,324 216,331 215,346 174,339" fill="#0f172a" />
    <line x1="178" y1="330" x2="212" y2="336" stroke="#475569" stroke-width="2" />
    <line x1="178" y1="335" x2="212" y2="341" stroke="#475569" stroke-width="2" />
    
    <!-- Headlight (Glow) -->
    <polygon points="204,328 216,330 215,336 204,334" fill="#38bdf8" />
    <circle cx="210" cy="333" r="4" fill="#ffffff" filter="url(#cyanGlow)" />
    
    <!-- Wheels -->
    <circle cx="120" cy="344" r="11" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <circle cx="120" cy="344" r="5" fill="#64748b" />
    <circle cx="155" cy="342" r="11" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <circle cx="155" cy="342" r="5" fill="#64748b" />
    <circle cx="196" cy="348" r="12" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <circle cx="196" cy="348" r="5.5" fill="#94a3b8" />
  </g>

  <!-- Right Fast Delivery Truck -->
  <g filter="url(#shadow)">
    <!-- Trailer Box -->
    <polygon points="407,284 344,276 344,338 407,346" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
    <polygon points="404,287 347,280 347,335 404,343" fill="#334155" />
    <!-- Roof highlight on trailer -->
    <polygon points="407,284 344,276 348,272 404,279" fill="#64748b" />

    <!-- Cabin Structure -->
    <polygon points="344,292 300,300 300,354 344,348" fill="url(#truckRightGrad)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />

    <!-- Cabin Windshield -->
    <polygon points="340,296 304,303 306,319 340,314" fill="#6ee7b7" stroke="#0f172a" stroke-width="2" />

    <!-- Cabin Bumper / Grille -->
    <polygon points="342,331 302,338 303,352 342,345" fill="#0f172a" />
    <line x1="338" y1="337" x2="306" y2="343" stroke="#475569" stroke-width="2" />
    <line x1="338" y1="342" x2="306" y2="348" stroke="#475569" stroke-width="2" />

    <!-- Headlight (Glow) -->
    <polygon points="308,335 296,337 297,343 308,341" fill="#34d399" />
    <circle cx="302" cy="340" r="4" fill="#ffffff" filter="url(#cyanGlow)" />

    <!-- Wheels -->
    <circle cx="392" cy="352" r="11" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <circle cx="392" cy="352" r="5" fill="#64748b" />
    <circle cx="360" cy="350" r="11" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <circle cx="360" cy="350" r="5" fill="#64748b" />
    <circle cx="316" cy="355" r="12" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <circle cx="316" cy="355" r="5.5" fill="#94a3b8" />
  </g>

  <!-- Lower Aerodynamic Wings Base (Half Blue / Half Green Emblem Base) -->
  <g filter="url(#shadow)">
    <!-- Left Blue Wing (Transport & Control) -->
    <path d="M 112 372 C 145 405 195 435 248 442 L 252 368 C 210 365 158 360 112 372 Z" fill="url(#blueWing)" stroke="#0f172a" stroke-width="3" />
    <!-- White Bevel Line -->
    <path d="M 118 375 C 150 405 195 430 245 437" stroke="#93c5fd" stroke-width="2.5" fill="none" opacity="0.6" />

    <!-- Right Green Wing (Logistics & Efficiency) -->
    <path d="M 400 372 C 367 405 317 435 264 442 L 260 368 C 302 365 354 360 400 372 Z" fill="url(#greenWing)" stroke="#0f172a" stroke-width="3" />
    <!-- White Bevel Line -->
    <path d="M 394 375 C 362 405 317 430 267 437" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.6" />
    
    <!-- Central Divider / Road Point -->
    <polygon points="256,368 248,442 264,442" fill="#f8fafc" />
  </g>
</svg>
